name = "exchange-bot"
main = "index.js"
compatibility_date = "2024-01-01"

# ── KV Namespace ──────────────────────────────────────────
# 1. Create the namespace:
#      npx wrangler kv:namespace create "BOT_KVS"
# 2. Copy the id from the output and paste it below.
# 3. For local dev preview, also create:
#      npx wrangler kv:namespace create "BOT_KVS" --preview
#    and paste that id into preview_id.

[[kv_namespaces]]
binding  = "BOT_KVS"
id       = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"
# preview_id = "REPLACE_WITH_YOUR_PREVIEW_KV_ID"

# ── Secrets (set via CLI, never hardcode here) ────────────
# Run these once:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put ADMIN_IDS
#
# BOT_TOKEN  → your Telegram bot token
# ADMIN_IDS  → comma-separated Telegram user IDs, e.g. "8758410535,987654321"

# ── Routes / Triggers ────────────────────────────────────
# Option A — Workers.dev subdomain (free, instant):
#   Deploy with: npx wrangler deploy
#   Then register the webhook:
#     curl "https://api.telegram.org/bot<TOKEN>/setWebhook?url=https://exchange-bot.<YOUR_SUBDOMAIN>.workers.dev"
#
# Option B — Custom domain:
# [[routes]]
# pattern = "bot.yourdomain.com/*"
# zone_name = "yourdomain.com"

# ── Environment variables (non-secret) ───────────────────
# [vars]
# SOME_FLAG = "true"

# ── Limits ───────────────────────────────────────────────
[limits]
cpu_ms = 50        # default; raise to 50 on free, up to 30000 on paid
